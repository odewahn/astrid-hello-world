#model: openai/gpt-4o-mini
model: openai/gpt-4o-mini
title: GCP Lessons

contents:
  - title: Freeform exploration
    prompt: freeform.md
  - title: PubSub
    filename: lesson1.md
  - title: Listing files in a directory
    filename: lesson2.md

# These variables will get patched into the MCP config from the shell
# since FastMCP does not support this automatically
inherited_shell_variables:
  - USER_HOME

mcpServers:

  shell_tool:
    transport: stdio
    command: bash 
    args: ["-c", "uvx mcp-shell-server 2>/dev/null"]
    env:
      ALLOW_COMMANDS: gcloud, gsutil, bq, python, uv, git, curl, jq, zip, unzip, tar, make, terraform
